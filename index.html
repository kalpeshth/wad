<body>
    
    
    <div class="form">
        <form action="/data.txt" id="registrationForm">

            <input type="email" placeholder="enter email" id="email" required>
            <br><br>
            <button type="submit"> Submit</button>
        </form>
    </div>
    
    <script src="script.js"></script>
</body>
